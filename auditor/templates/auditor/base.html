<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GitAudit Platform{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS v3.4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        glasgow: {
                            blue: '#003865',
                            blueHover: '#00457c',
                            gold: '#F3D54E',
                        },
                        dark: {
                            bg: '#0f172a',
                            panel: 'rgba(30, 41, 59, 0.7)',
                            border: 'rgba(255, 255, 255, 0.1)',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS (for animations) -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if user.is_authenticated %}
    <nav style="padding: 1rem; text-align: right; background: rgba(0,0,0,0.2);">
        <span style="margin-right: 1rem;">Welcome, {{ user.username }}</span>
        <a href="{% url 'logout' %}" class="btn btn-primary" style="padding: 0.5rem 1rem; width: auto; text-decoration: none;">Logout</a>
    </nav>
    {% endif %}

    {% block content %}
    {% endblock %}
    
    {% block extra_js %}{% endblock %}
</body>
</html>
