{% extends 'auditor/base.html' %}
{% load static %}

{% block title %}Login | GitAudit{% endblock %}

{% block content %}
<div class="background-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="auth-wrapper">
    <div class="glass-panel auth-card">
        <div class="text-center mb-6">
            <div class="glasgow-logo-container">
                <img src="{% static 'img/crest.png' %}" alt="University of Glasgow" class="glasgow-crest">
                <h1 class="logo-text">University of Glasgow</h1>
            </div>
            <p class="text-muted">GitAudit Platform</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-error">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username" class="form-label">Email or Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your email or username" required autofocus>
            </div>
            
            <div class="form-group mb-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
